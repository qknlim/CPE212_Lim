---
- name: Restart kibana
  ansible.builtin.systemd:
    name: kibana
    state: restarted
    daemon_reload: true

- name: Reload kibana
  ansible.builtin.systemd:
    name: kibana
    state: reloaded

- name: Start kibana
  ansible.builtin.systemd:
    name: kibana
    state: started
    enabled: true
